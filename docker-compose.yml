services:
  frontend:
    build:
      context: ./my-app
    ports:
      - "5175:5175"
    volumes:
      - ./my-app:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    depends_on:
      - backend

  backend:
    build:
      context: ./sentiment_analysis
    ports:
      - "8000:8000"
    volumes:
      - ./sentiment_analysis:/app
    # Slack投稿用。値は同ディレクトリの .env から読む(.env は git 管理外)
    environment:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL: ${SLACK_CHANNEL:-}
