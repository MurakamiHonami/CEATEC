services:
  frontend:
    build:
      context: ./my-app
    ports:
      - "5175:5175"
    volumes:
      - ./my-app:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    depends_on:
      - backend

  backend:
    build:
      context: ./sentiment analysis
    ports:
      - "8002:8002"
    volumes:
      - ./sentiment analysis:/app
