server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # docker compose のサービス名を都度解決する(backend 再作成でIPが変わっても追随するため)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # APIはフロントと同一オリジン(/api/)で提供する。
    # api.ceatec.streeeak.link のような2段サブドメインは Cloudflare の
    # *.streeeak.link 証明書の対象外でTLSが張れないため、パスで振り分けている。
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 疎通確認用(backend の /health をブラウザから叩けるようにしておく)
    location = /healthz {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/health;
    }
}
