name: Deploy Home Server

on:
  push:
    branches:
      - infra
      - main
    paths:
      - ".github/workflows/deploy-home-server.yml"
      - "backend/**"
      - "my-app/**"
      - "sentiment analysis/**"
      - "docker-compose.server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-home-server-main
  cancel-in-progress: false

env:
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  GHCR_NAMESPACE: ${{ vars.GHCR_NAMESPACE }}
  PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
  HOME_SERVER_APP_DIR: ${{ vars.HOME_SERVER_APP_DIR }}
  HOME_SERVER_FRONTEND_PORT: ${{ vars.HOME_SERVER_FRONTEND_PORT }}
  HOME_SERVER_BACKEND_PORT: ${{ vars.HOME_SERVER_BACKEND_PORT }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.image-meta.outputs.backend_image }}
      frontend_image: ${{ steps.image-meta.outputs.frontend_image }}
      backend_latest_image: ${{ steps.image-meta.outputs.backend_latest_image }}
      frontend_latest_image: ${{ steps.image-meta.outputs.frontend_latest_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image names
        id: image-meta
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -eu
          namespace="${GHCR_NAMESPACE:-$REPOSITORY_OWNER}"
          namespace="$(echo "$namespace" | tr '[:upper:]' '[:lower:]')"

          project="${PROJECT_NAME:-$REPOSITORY_NAME}"
          project="$(echo "$project" | tr '[:upper:]' '[:lower:]')"

          echo "backend_image=ghcr.io/${namespace}/${project}-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "backend_latest_image=ghcr.io/${namespace}/${project}-backend:latest" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${namespace}/${project}-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_latest_image=ghcr.io/${namespace}/${project}-frontend:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image-meta.outputs.backend_image }}
            ${{ steps.image-meta.outputs.backend_latest_image }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./my-app
          file: ./my-app/Dockerfile
          push: true
          build-args: |
            REACT_APP_API_BASE_URL=${{ env.PUBLIC_API_BASE_URL }}
          tags: |
            ${{ steps.image-meta.outputs.frontend_image }}
            ${{ steps.image-meta.outputs.frontend_latest_image }}

  deploy:
    name: Deploy to Home Server
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # sshpass reads the password from this variable (empty = 鍵認証 / Tailscale SSH)
      SSHPASS: ${{ secrets.HOME_SERVER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Configure SSH over Tailscale
        shell: bash
        env:
          HOME_SERVER_HOST: ${{ secrets.HOME_SERVER_HOST }}
          HOME_SERVER_USER: ${{ secrets.HOME_SERVER_USER }}
          HOME_SERVER_SSH_PORT: ${{ vars.HOME_SERVER_SSH_PORT || '22' }}
          HOME_SERVER_SSH_KEY: ${{ secrets.HOME_SERVER_SSH_KEY }}
        run: |
          set -eu

          tailscale ping --timeout=5s "$HOME_SERVER_HOST" || \
            echo "tailscale ping に応答なし。そのまま SSH を試行します"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          {
            echo "Host homeserver"
            echo "  HostName $HOME_SERVER_HOST"
            echo "  User $HOME_SERVER_USER"
            echo "  Port $HOME_SERVER_SSH_PORT"
            # Tailnet 内の接続なのでホスト鍵の事前登録(fingerprint)は行わない
            echo "  StrictHostKeyChecking no"
            echo "  UserKnownHostsFile /dev/null"
            echo "  LogLevel ERROR"
            echo "  ConnectTimeout 20"
            echo "  ServerAliveInterval 30"
            echo "  ServerAliveCountMax 6"
            if [ -n "${HOME_SERVER_SSH_KEY:-}" ]; then
              echo "  IdentityFile ~/.ssh/home_server_key"
              echo "  IdentitiesOnly yes"
            fi
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

          if [ -n "${HOME_SERVER_SSH_KEY:-}" ]; then
            printf '%s\n' "$HOME_SERVER_SSH_KEY" > ~/.ssh/home_server_key
            chmod 600 ~/.ssh/home_server_key
          fi

          # パスワード認証を使う場合のみ sshpass を挟むラッパーを用意する
          if [ -n "${SSHPASS:-}" ] && ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi

          mkdir -p "$HOME/bin"
          for cmd in ssh scp; do
            cat > "$HOME/bin/d$cmd" <<EOF
          #!/usr/bin/env bash
          if [ -n "\${SSHPASS:-}" ]; then
            exec sshpass -e $cmd "\$@"
          fi
          exec $cmd "\$@"
          EOF
            chmod +x "$HOME/bin/d$cmd"
          done
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Ensure deploy directory exists
        shell: bash
        env:
          SERVER_APP_DIR: ${{ env.HOME_SERVER_APP_DIR }}
        run: |
          set -eu
          : "${SERVER_APP_DIR:?vars.HOME_SERVER_APP_DIR が未設定です}"
          dssh homeserver "id -un; mkdir -p '$SERVER_APP_DIR'"

      - name: Upload server compose file
        shell: bash
        env:
          SERVER_APP_DIR: ${{ env.HOME_SERVER_APP_DIR }}
        run: |
          set -eu
          dscp docker-compose.server.yml "homeserver:$SERVER_APP_DIR/docker-compose.server.yml"

      - name: Deploy application
        shell: bash
        env:
          SERVER_APP_DIR: ${{ env.HOME_SERVER_APP_DIR }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_PORT: ${{ env.HOME_SERVER_BACKEND_PORT }}
          FRONTEND_PORT: ${{ env.HOME_SERVER_FRONTEND_PORT }}
        run: |
          set -eu
          # 変数は標準入力経由で渡す(コマンドラインに載せないので ps から見えない)
          {
            for name in SERVER_APP_DIR BACKEND_IMAGE FRONTEND_IMAGE GHCR_USERNAME GHCR_TOKEN BACKEND_PORT FRONTEND_PORT; do
              printf 'export %s=%q\n' "$name" "${!name}"
            done
            cat <<'REMOTE'
          set -eu
          cd "$SERVER_APP_DIR"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          docker compose -f docker-compose.server.yml pull
          docker compose -f docker-compose.server.yml up -d --remove-orphans
          docker image prune -f
          docker logout ghcr.io
          REMOTE
          } | dssh homeserver bash -s
